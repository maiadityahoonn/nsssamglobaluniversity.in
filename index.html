        align-items: center;

        font-size: 9px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: #fdba74;
        margin-bottom: 12px;
      }
      @media (min-width: 375px) { #initial-loader .il-pill { font-size: 10px; } }
      @media (min-width: 640px) { #initial-loader .il-pill { font-size: 11px; padding: 4px 12px; margin-bottom: 14px; } }
      #initial-loader .il-dot {

        align-items: center;

      }
      #initial-loader .il-svg {

        inset: 4px;
        width: calc(100% - 8px);
        height: calc(100% - 8px);

      #initial-loader .il-logo-box {

            <circle id="il-ring" cx="64" cy="64" r="56" fill="none" stroke="url(#ilGrad)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="351.86" stroke-dashoffset="348.34" />

        </div>
      </div>
    </div>
    <script>
      (function () {
        var p = 1;
        window.__nssProgress = 1;
        var circ = 2 * Math.PI * 56;
        var pctEl = document.getElementById('il-pct');
        var barEl = document.getElementById('il-bar');
        var ringEl = document.getElementById('il-ring');
        var statusEl = document.getElementById('il-status');
        window.__nssInterval = setInterval(function () {
          if (p < 75) {
            p += 1;
            window.__nssProgress = p;
            if (pctEl) pctEl.textContent = String(p);
            if (barEl) barEl.style.width = p + '%';
            if (ringEl) ringEl.setAttribute('stroke-dashoffset', String(circ - (p / 100) * circ));
            if (statusEl && p >= 36) statusEl.textContent = 'Loading Community Drives & Media...';
          }
        }, 32);
      })();
    </script>
    <div id="root"></div>
